<!DOCTYPE html>
<html lang="ko">
	<head>
		<meta charset="utf-8">
		<meta name="description" content="The Soul — 브라우저에서 즐기는 던전 로그라이크 게임">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>The soul 프로젝트</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

	<meta name="theme-color" content="#141c23">
		<link rel="manifest" href="app.webmanifest">
		<script defer src="web-app.js?v=b35ddbf3fd18684601190a1a2fd1698f61f5a7e86311e87d4e05cda7430c24f6" data-release="b35ddbf3fd18684601190a1a2fd1698f61f5a7e86311e87d4e05cda7430c24f6"></script>
		</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="game-loader.js?v=e3362d66ae41d236"></script>
		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":0,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":186658604,"index.wasm":39509339},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
function configureGameCanvas(canvas) {
  const aspect = 16 / 9;
  const modes = [
    { title: '선명', maxWidth: 1920 },
    { title: '균형', maxWidth: 1600 },
    { title: '성능', maxWidth: 1280 },
    { title: '경량', maxWidth: 960 },
  ];
  const preferenceKey = 'the-soul.canvas-quality';
  let mode = window.matchMedia('(pointer: coarse)').matches ? 3 : 1;
  try {
    const preference = localStorage.getItem(preferenceKey);
    const saved = Number(preference);
    if (preference !== null && Number.isInteger(saved) && saved >= 0 && saved < modes.length) mode = saved;
  } catch {
    // Browsers can deny storage in private sessions.
  }

  Object.assign(canvas.style, {
    position: 'absolute', left: '50%', top: '50%', transform: 'translate(-50%, -50%)',
  });

  function resize() {
    const visibleWidth = Math.min(window.innerWidth, window.innerHeight * aspect);
    const physicalWidth = visibleWidth * (window.devicePixelRatio || 1);
    const width = Math.max(16, Math.min(modes[mode].maxWidth, Math.round(physicalWidth / 16) * 16));
    const height = width / aspect;
    canvas.style.width = `${visibleWidth}px`;
    canvas.style.height = `${visibleWidth / aspect}px`;
    if (canvas.width !== width) canvas.width = width;
    if (canvas.height !== height) canvas.height = height;
  }

  if (window.ResizeObserver) new ResizeObserver(resize).observe(document.documentElement);
  window.addEventListener('resize', resize);
  resize();

  return function showQualityPicker() {
    const button = document.createElement('button');
    button.type = 'button';
    button.style.cssText = 'position:fixed;z-index:10;bottom:max(6px,env(safe-area-inset-bottom));right:max(6px,env(safe-area-inset-right));min-height:36px;padding:4px 10px;border:1px solid #a89272;border-radius:7px;background:#141c23ed;color:#fff;font:600 13px system-ui;cursor:pointer';
    function labelQuality() {
      button.textContent = `화질 ${modes[mode].title}`;
      button.title = `다음 화질 · ${modes[(mode + 1) % modes.length].title}`;
    }
    button.addEventListener('click', () => {
      mode = (mode + 1) % modes.length;
      try { localStorage.setItem(preferenceKey, String(mode)); } catch {}
      resize();
      labelQuality();
      canvas.focus({ preventScroll: true });
    });
    labelQuality();
    document.body.append(button);
  };
}

const showCanvasQuality = configureGameCanvas(document.getElementById('canvas'));
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
			showCanvasQuality();
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
